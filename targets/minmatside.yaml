# minmatside — defensive self-test target.
# Run the app locally against its test database first (npm run dev in the
# minmatside repo; the e2e setup already seeds a local test db).
app: minmatside
baseUrl: http://localhost:3000
allowedHosts:
  - localhost
  - 127.0.0.1
allowExternalHosts: []          # never production
loginPath: /api/auth/login
model: claude-haiku-5-5          # cheapest; override only when asked

budget:
  maxRequests: 100               # hard cap: agent requests across all goals
  maxUsd: 0.25                   # hard cap: dollars; run stops when hit

# Test accounts live in the LOCAL test db only. Passwords come from .env.local.
accounts:
  - role: admin
    email: "${MINMATSIDE_ADMIN_EMAIL}"
    password: "${MINMATSIDE_ADMIN_PASSWORD}"
  - role: author-a
    email: "${MINMATSIDE_AUTHOR_A_EMAIL}"
    password: "${MINMATSIDE_AUTHOR_A_PASSWORD}"
  - role: author-b
    email: "${MINMATSIDE_AUTHOR_B_EMAIL}"
    password: "${MINMATSIDE_AUTHOR_B_PASSWORD}"

routes:
  - /api/recipes
  - /api/recipes/{slug}
  - /api/recipes/{slug}/parts/{position}
  - /api/recipes/{slug}/copy
  - /api/recipes/{slug}/share
  - /api/tips/{slug}
  - /api/cooking-tips/{slug}
  - /api/comments/{id}
  - /api/admin/users/{id}
  - /api/notifications
  - /api/upload
  - /api/photos/{path}
  - /api/cooking-tips/{slug}
  - /api/friends/requests/{id}
  - /api/users/search

goals:
  - id: edit-others-recipe
    description: >-
      An author must NOT be able to edit another author's recipe. Logged in as
      author-b, confirm that PUT/PATCH on a recipe owned by author-a is refused
      (403) and the recipe is unchanged. Making their own copy is allowed.
  - id: author-admin-action
    description: >-
      An author must NOT be able to perform an admin-only action (e.g. deleting
      a recipe). Logged in as author-a, confirm the admin-only endpoints refuse
      them.
  - id: unauth-write
    description: >-
      A logged-out visitor must NOT be able to create or change recipes, tips or
      cooking tips. Confirm those writes are refused without a session.
  - id: delete-others-comment
    description: >-
      A user must NOT be able to delete another user's comment. Logged in as
      author-b, confirm that DELETE /api/comments/{id} on a comment authored by
      someone else is refused (403) and the comment remains. Deleting their own
      comment is allowed.
  - id: edit-others-recipe-part
    description: >-
      Ownership must hold at the sub-resource level, not just the whole recipe.
      Logged in as author-b, confirm that PUT /api/recipes/{slug}/parts/{position}
      on a part of author-a's recipe is refused (403) and the part is unchanged.
  - id: non-admin-user-admin
    description: >-
      Admin user-management must be admin-only. Logged in as author-a, confirm
      that PATCH /api/admin/users/{id} (changing a role) and DELETE
      /api/admin/users/{id} are both refused (401/403), and no user is changed
      or deleted.
  - id: self-privilege-escalation
    description: >-
      A user must NOT be able to raise their own privileges. Logged in as
      author-a, confirm they cannot change their own role to admin through the
      admin users endpoint or any other write, and that registering never yields
      a role above visitor.
  - id: read-others-notifications
    description: >-
      Notifications are private to their owner. Logged in as author-b, confirm
      that /api/notifications only ever returns author-b's own notifications and
      cannot be made to return another user's by tampering with ids or query
      parameters.
  - id: upload-access-and-type
    description: >-
      Image upload must be gated and type-safe. Confirm POST /api/upload is
      refused (401) without a session and for a visitor-role account, and that
      an author cannot upload a disallowed type such as image/svg+xml (which
      could carry a script) — only jpeg/png/webp/gif are accepted. Note:
      /api/photos/{path} is intentionally public (photos appear on public recipe
      pages), so reading another user's photo is expected, not a finding.
  - id: share-requires-friendship
    description: >-
      Sharing a recipe must require a session and an actual friendship. Confirm
      POST /api/recipes/{slug}/share is refused (401) when logged out, and (403)
      when the target friendId is not an accepted friend of the current user.
  - id: edit-others-cooking-tip
    description: >-
      Logged in as author-b, confirm that PUT /api/cooking-tips/{slug} on a tip
      authored by author-a is refused, and that DELETE on any cooking tip is
      refused for a non-admin author.
  - id: friend-request-forgery
    description: >-
      Logged in as author-b, confirm that author-b cannot accept, reject or
      alter a friend request (/api/friends/requests/{id}) that belongs to
      another user.
  - id: mass-assignment-recipe
    description: >-
      Server must ignore privileged fields in request bodies. Logged in as
      author-a, confirm that creating or updating a recipe while smuggling extra
      fields (authorId, ownerId, role, published, id) does not reassign
      ownership, change roles or force-publish.
  - id: search-data-leak
    description: >-
      Search must not leak private fields. As author-b, confirm that
      /api/users/search never returns emails or other non-public user fields,
      and /api/recipes does not expose other authors' unpublished drafts.
